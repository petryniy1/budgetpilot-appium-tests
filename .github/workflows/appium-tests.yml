name: Appium tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tests repo
        uses: actions/checkout@v4

      - name: Checkout BudgetPilot
        uses: actions/checkout@v4
        with:
          repository: petryniy1/BudgetPilot
          path: BudgetPilot

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app, run tests, build Allure report
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel
          script: bash .github/scripts/run-in-emulator.sh

      - name: Upload Allure results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: |
            build/allure-results/
            screenshots/
          if-no-files-found: ignore

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/reports/allure-report/allureReport